name: CI

on:
  push:
    branches: [main, master, release/v10.110.0]
  pull_request:
    branches: [main, master, release/v10.110.0]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Go module lives in tianxuan/ (repo root is not a Go module). Run the actual
# gofmt/vet/build/test/cacheguard steps there; `uses:` actions resolve their
# paths against the repo root, so those stay untouched below.
defaults:
  run:
    working-directory: tianxuan

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tianxuan/go.mod
          cache: true

      - name: cacheguard
        run: go run ./cmd/cacheguard

      - name: gofmt
        # Historical debt: ~337 Go files are not gofmt-clean today. Report but
        # don't block until `make fmt` is run and re-verified; vet/build/test
        # and cacheguard below remain hard gates.
        continue-on-error: true
        run: |
          # Root module only — desktop/ is a separate module with its own tooling.
          unformatted=$(gofmt -l . | grep -v '^desktop/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...
