# Tianxuan configuration.
# Resolution order: flag > ./tianxuan.toml > ~/.config/tianxuan/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

default_model = "deepseek"   # a provider name (→ its default model) or "provider/model"
# language      = "zh"   # ui language; empty = auto-detect from $LANG / $TIANXUAN_LANG

[agent]
system_prompt = """
You are Tianxuan, a coding agent focused on executing code tasks.
Use the provided tools to read and write files and run shell commands.
Principles: understand the request before acting; verify with tools instead of
guessing; keep changes minimal and correct; briefly summarize what you did."""
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
max_steps   = 25
temperature = 0.0
# auto_plan   = "ask"   # 单模型规划模式: off = 直接执行（默认）, ask = 复杂任务先规划确认
# subagent_model = "deepseek-pro"   # optional default for runAs=subagent skills
# subagent_models = { review = "deepseek-pro", security_review = "deepseek-pro" }   # per-skill overrides
# output_style = "explanatory"   # persona/tone folded into the prompt: explanatory | learning | concise,
#                                  or a custom .tianxuan/output-styles/<name>.md ; empty = default

# A provider is a vendor endpoint (one base_url + key) that offers one or more
# models. Use `models = [...]` to expose several under a single entry — switching
# models reuses the same connection; no need to re-declare base_url/api_key.
[[providers]]
name        = "deepseek"
kind        = "openai"
base_url    = "https://api.deepseek.com"
models      = ["deepseek-v4-flash", "deepseek-v4-pro"]
default     = "deepseek-v4-flash"   # optional; defaults to the first of `models`
# fallbacks  = ["deepseek-v4-flash"]  # optional: model fallback chain (same key).
#   Primary 限流/过载/断网时按序回退，turn-local（只当前回合生效，下回合回到主
#   模型，保持前缀缓存稳定）。蒸馏自 OpenClaw model-failover。
api_key_env = "DEEPSEEK_API_KEY"
context_window = 1000000
price       = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }   # per 1M tokens

# A single-model provider still works (use `model = "..."`) — pick this form when a
# model needs its own base_url / context_window / price (e.g. the two MiMo SKUs
# below have different context windows).
price       = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" }   # per 1M tokens

[[providers]]
name           = "mimo-pro"
kind           = "openai"
base_url       = "https://api.xiaomimimo.com/v1"
model          = "mimo-v2.5-pro"   # thinking-mode on by default; reasoning_content rendered dim above the answer
api_key_env    = "MIMO_API_KEY"
context_window = 1000000

[[providers]]
name           = "mimo-flash"
kind           = "openai"
base_url       = "https://api.xiaomimimo.com/v1"
model          = "mimo-v2-flash"   # thinking-mode off by default; cheaper / faster
api_key_env    = "MIMO_API_KEY"
context_window = 65536

# Anthropic (Claude) — the "anthropic" kind speaks the Messages API directly (no
# OpenAI shim). base_url is optional (defaults to https://api.anthropic.com). Note:
# this provider does not enable extended thinking and does not send temperature —
# current Claude models reject sampling params (see internal/provider/anthropic).
[[providers]]
name           = "claude"
kind           = "anthropic"
model          = "claude-opus-4-8"
api_key_env    = "ANTHROPIC_API_KEY"
context_window = 1000000
price          = { cache_hit = 0.5, input = 5, output = 25, currency = "$" }   # per 1M tokens
# Extended thinking (anthropic kind only; round-trips the signed reasoning block
# across tool calls). Omit to disable. effort: low | medium | high | xhigh | max.
thinking       = "adaptive"
effort         = "high"

# OpenCode Zen — one key, many vendors (https://opencode.ai). The "opencode"
# kind routes each model to the protocol Zen serves it on:
#   deepseek-* / kimi-* / glm-* / minimax-* / *-free  ->  /zen/v1/chat/completions (Bearer)
#   claude-* / qwen*                                  ->  /zen/v1/messages (x-api-key)
#   gpt-* / grok-*                                    ->  /zen/v1/responses (Bearer)
# Free models (e.g. deepseek-v4-flash-free) work with NO key; paid models need
# OPENCODE_API_KEY. base_url is optional (default https://opencode.ai/zen/v1);
# OpenCode Go subscribers point it at https://opencode.ai/zen/go/v1 instead.
# Gemini models are not supported yet (Google protocol).
[[providers]]
name        = "zen"
kind        = "opencode"
base_url    = "https://opencode.ai/zen/v1"   # optional; explicitly set so TOML index-merge never inherits another provider's endpoint
models      = ["deepseek-v4-flash-free", "claude-haiku-4-5", "gpt-5.4-nano"]
default     = "deepseek-v4-flash-free"   # optional; defaults to the first of `models`
api_key_env = "OPENCODE_API_KEY"         # optional when only using free models
context_window = 1000000
# per-model pricing (optional): price = { cache_hit = 0, input = 0, output = 0, currency = "$" }

[tools]
enabled = []   # empty = all built-in tools. The shipped default is a compact
                # core whitelist (18 tools) — see config.Default().
# compact = true  # hides redundant tools (glob/delete_range/multi_edit/...)
                  # from the model-visible schema; they stay callable. Decided
                  # once at boot, never mid-session, so the request prefix is
                  # cache-stable. Set false to expose the full toolset.

# Foreground bash timeout in seconds (host-injected; the model cannot set it).
# Omitted = 120s default; 0 = no tool-local cap (only cancellation stops the
# command). Long-running servers/watchers should use run_in_background instead.
# bash_timeout_seconds = 120

# CodeGraph code intelligence (symbol/call-graph search via tree-sitter + SQLite),
# a built-in MCP server giving the agent codegraph_* search / context / explore /
# trace / node tools. On by default. The runtime is fetched into a per-version
# cache on first use (auto_install); .codegraph/ is then initialised (fast) and
# CodeGraph's daemon indexes in the background, so installs and startup stay fast
# even on a large repo. Disable to fall back to grep/glob, turn off auto_install
# to require an explicit `tianxuan codegraph install`, or point `path` at a launcher.
# [codegraph]
# enabled      = true
# auto_install = true
# path         = ""   # empty = cache, then PATH, then a bundle beside tianxuan

# Skills are invokable playbooks (SKILL.md / <name>.md with frontmatter), found
# under .tianxuan/skills, .agents/skills, .agent/skills, .claude/skills (project)
# and the same dirs under ~ (global). Built-ins (explore/research/review/security-review/test)
# ship out of the box. The model invokes them via run_skill / explore / …; you
# invoke them via /<name>. Manage with /skill (list, show, new, paths).
# [skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra "custom"-scope skill roots

# Hooks run shell commands around the loop (PreToolUse / PostToolUse /
# UserPromptSubmit / Stop). They are NOT configured here — put them in
# settings.json: ~/.tianxuan/settings.json (global, always on) and
# <project>/.tianxuan/settings.json (project, runs only after `/hooks trust`).
# Exit 0 = pass, exit 2 = block (PreToolUse / UserPromptSubmit only). Example
# ~/.tianxuan/settings.json:
#   { "hooks": {
#       "PreToolUse":  [ { "match": "bash", "command": "my-guard.sh" } ],
#       "PostToolUse": [ { "match": ".*file", "command": "gofmt -w ." } ],
#       "Stop":        [ { "command": "notify-send 'turn done'" } ] } }

# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow"} as JSON on stdin.
# [statusline]
# command = "my-statusline.sh"

# External stdio plugins (MCP-compatible); each is a standalone executable.
# [[plugins]]
# name    = "example"
# command = "tianxuan-plugin-example"
