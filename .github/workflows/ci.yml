name: CI

on:
  push:
    branches: [main, master, release/v10.110.0]
  pull_request:
    branches: [main, master, release/v10.110.0]
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Go module lives in tianxuan/ (repo root is not a Go module). Run the actual
# gofmt/vet/build/test/cacheguard steps there; `uses:` actions resolve their
# paths against the repo root, so those stay untouched below.
defaults:
  run:
    working-directory: tianxuan

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: tianxuan/go.mod
          cache: true

      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: tianxuan
          only-new-issues: true

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tianxuan/go.mod
          cache: true

      - name: cacheguard
        run: go run ./cmd/cacheguard

      - name: gofmt
        # Historical debt: ~337 Go files are not gofmt-clean today. Report but
        # don't block until `make fmt` is run and re-verified; vet/build/test
        # and cacheguard below remain hard gates.
        continue-on-error: true
        run: |
          # Root module only — desktop/ is a separate module with its own tooling.
          unformatted=$(gofmt -l . | grep -v '^desktop/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        # Fast gate: -short skips slow external-dependency tests (npx, live
        # network, process trees). The nightly job below runs the full suite.
        run: go test -short ./...

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tianxuan/go.mod
          cache: true

      - name: Full tests (including slow)
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tianxuan/desktop/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tianxuan/desktop/frontend

      - name: Frontend tests
        run: pnpm test
        working-directory: tianxuan/desktop/frontend

      - uses: actions/setup-go@v5
        with:
          go-version-file: tianxuan/go.mod
          cache: true

      - name: Desktop module tests
        run: go test ./...
        working-directory: tianxuan/desktop
